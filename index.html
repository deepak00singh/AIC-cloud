<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIC Cloud Documentation Portal</title>
    <meta name="description" content="Official documentation portal for AIC Cloud user guides and developer references." />
    <link rel="icon" type="image/png" href="/images/aic-cloud-mark.png" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('aic-cloud-theme');
          var isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-neutral-800 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
